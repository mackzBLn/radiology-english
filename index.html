<!doctype html>
<html lang="de" style="background:#141416">
<head>
<meta charset="utf-8">
<!--
Radiology English: Hülle der App, der Inhalt entsteht in js/ui/app.js. Kein Inhalt von fremden Servern.
"Quelle N" verweist auf die Quellenlisten des Projekts.
 [H1] https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/viewport
 [H2] https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/color-scheme
 [H3] https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/theme-color
 [H4] https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script
 [H5] https://developer.mozilla.org/en-US/docs/Web/API/Window/error_event
-->
<!-- viewport-fit=cover, damit env(safe-area-inset-bottom) wirkt (Quelle 37, [H1]). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Für Suchmaschinen gesperrt (Quelle 16). -->
<meta name="robots" content="noindex">
<!-- Dunkel, bevor das Stylesheet geladen ist [H2]. -->
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141416"><!-- [H3] -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rad English">
<title>Radiology English</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><p class="startup">Die App startet.</p></div>
<!-- Lädt app.js nicht, gibt es noch keine Fehlerkarte, und die Home-Bildschirm-App hat keinen Knopf zum Neuladen. Darum ohne Abhängigkeiten. -->
<div id="start-failed" class="startup" hidden>
<p>Die App ließ sich nicht starten. Dein Lernstand bleibt erhalten.</p>
<button type="button" class="btn btn-primary" onclick="location.reload()">Neu laden</button>
</div>
<script>
// onerror am Skript meldet eine Datei, die nicht lädt [H4]. Ein Fehler beim Ausführen der Module kommt am Fenster an [H5], app.js meldet sich dort ab.
function startFailed() {
  document.getElementById("app").hidden = true;
  document.getElementById("start-failed").hidden = false;
}
window.addEventListener("error", startFailed);
</script>
<script type="module" src="js/ui/app.js" onerror="startFailed()"></script>
</body>
</html>
